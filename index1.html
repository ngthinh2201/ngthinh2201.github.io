<!doctype html>
<html lang="vi">
  <head>

    <link

    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;

        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: #ff2d8a;
        left: -15vmax;
        top: -10vmax;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: #8a3dff;
        right: -12vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
        visibility: hidden;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.9rem, 8.5vw, 4rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.6rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 30px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s;
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose);
        will-change: transform;
        transition: opacity 1s;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn,
      .b2 {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: transform 0.2s;
        z-index: 5;
      }
      #btn:hover,
      .b2:hover {
        transform: scale(1.07);
      }
      .b2.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border: 1px solid rgba(255, 182, 213, 0.5);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 182, 213, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.35),
          inset 0 0 40px rgba(255, 150, 200, 0.08);
        transform: scale(0.85) translateY(30px);
        transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.2s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .t-solved {
        font-family: var(--script);
        font-size: 1rem;
        color: #ff6fae;
        margin: 0.2rem 0 0.6rem;

        animation: solvedIn 0.8s ease 0.3s forwards;
      }
      @keyframes solvedIn {
        to {
          opacity: 1;

        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;

      }
      .orn:before,
      .orn:after {
        content: "";

      }
      .orn:after {

      }
      #msg {
        font-weight: 300;

      }
      .wishes {

      }
      .w {
        padding: 0.55rem 0.45rem;

        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.1rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 1s;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      * {
        cursor: none !important;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 26px;
        color: #ff3d84;
        text-shadow:
          0 0 12px #ff3d84,
          0 0 28px #ff6fae;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.1s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }

      #bg-wishes {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #bg-wishes.visible {
        opacity: 1;
        visibility: visible;
      }
      .wish {
        position: absolute;
        font-family: "Dancing Script", "Pacifico", "Brush Script MT",
          "Segoe Script", "Comic Sans MS", cursive, sans-serif;
        font-weight: 700;
        white-space: nowrap;
        color: #ff7eb6;
        opacity: 0;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8),
          0 0 10px rgba(255, 158, 200, 0.5);
        animation: wishFloat linear infinite;
        will-change: transform, opacity;
        user-select: none;
        letter-spacing: 0.02em;
      }
      @keyframes wishFloat {
        0% {
          transform: translate3d(0, 0, 0) rotate(var(--rot, 0deg));
          opacity: 0;
        }
        10% {
          opacity: 0.9;
        }
        50% {
          opacity: 1;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translate3d(var(--dx, 30px), -110vh, 0)
            rotate(calc(var(--rot, 0deg) + var(--drot, 12deg)));
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    
    <div id="bg-wishes" aria-hidden="true"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">âœ¦ CÃ³ má»™t thÃ´ng Ä‘iá»‡p Ä‘ang bay láº¡c... âœ¦</div>
      <button id="btn">Giáº£i mÃ£ ðŸ’Œ</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 Â· 10 &nbsp;NgÃ y Phá»¥ ná»¯ Viá»‡t Nam</span>
        <div class="big">ðŸ’–</div>
        <p class="t1">DÃ nh táº·ng cho</p>
        <h1 class="t2" id="name"></h1>
        <p class="t-solved">ðŸ”“ Giáº£i mÃ£ thÃ nh cÃ´ng ðŸ’–</p>
        <div class="orn">â€ â¤ â€</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          
        </div>
      </div>
    </div>

    <script>
      const CFG = {
        l1: "CHÃšC Má»ªNG 20/10",
        l2: "LAN Ã",
        name: "Lan Ã",
        intro:
          "NhÃ¢n ngÃ y 20/10, chÃºc Lan Ã luÃ´n xinh Ä‘áº¹p, ráº¡ng rá»¡ nhÆ° Ä‘Ã³a há»“ng Ä‘áº§u mÃ¹a. Mong má»—i ngÃ y cá»§a báº¡n Ä‘á»u ngáº­p trÃ n tiáº¿ng cÆ°á»i vÃ  tháº­t nhiá»u yÃªu thÆ°Æ¡ng. ðŸŒ¸",
        wishes: [
          ["ðŸŒ¸", "LuÃ´n xinh Ä‘áº¹p", "Ráº¡ng rá»¡ tá»« ná»¥ cÆ°á»i Ä‘áº¿n trÃ¡i tim."],
          ["ðŸ’–", "Tháº­t háº¡nh phÃºc", "Má»—i ngÃ y Ä‘á»u cÃ³ má»™t niá»m vui nhá»."],
          ["âœ¨", "BÃ¬nh yÃªn", "Nháº¹ nhÃ ng giá»¯a má»i bá»™n bá»."],
          ["ðŸŒ¹", "ÄÆ°á»£c yÃªu thÆ°Æ¡ng", "Nhiá»u hÆ¡n báº¡n cÃ³ thá»ƒ Ä‘áº¿m háº¿t."],
        ],
        quote:
          "Cáº£m Æ¡n báº¡n vÃ¬ Ä‘Ã£ xuáº¥t hiá»‡n vÃ  lÃ m tháº¿ giá»›i nÃ y dá»‹u dÃ ng hÆ¡n ráº¥t nhiá»u.",
        sign: "â€” Má»™t ngÆ°á»i luÃ´n nghÄ© Ä‘áº¿n báº¡n ðŸŒ¹",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYÄ‚Ã‚ÃŠÃ”Æ Æ¯0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;
      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
       
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
       
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffd9a8",
          "#e0b3ff",
          "#fff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giáº£i mÃ£ thÃ nh cÃ´ng ðŸ’–";
          heartStorm();
         
         
         
          setTimeout(() => {
           
            $("stage").classList.add("hide");
           
            const bgm = document.getElementById('bgm');
            if (bgm) {
              bgm.volume = 0.6;
              const p = bgm.play();
              if (p && p.catch) p.catch(() => {});
            }
           
            const bw = $("bg-wishes");
            if (bw) bw.classList.add("visible");
            if (typeof window.openScratchOverlay === "function") {
              window.openScratchOverlay(showCard);
            } else {
              showCard();
            }
          }, 800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "CÃ¡c chá»¯ cÃ¡i Ä‘ang tÃ¬m vá» nhau... âœ¨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function sparkle(el) {

    <div id="scratch-overlay" aria-hidden="true">
        <canvas id="scratch-canvas"></canvas>
    </div>

    <style>
        #scratch-overlay {
            position: fixed;
            inset: 0;
            z-index: 2147483600;
            background: transparent;
            overflow: hidden;
            transition: opacity 0.6s ease;
            opacity: 1;
        }
        #scratch-overlay.is-fading {
            opacity: 0;
            pointer-events: none;
        }
        #scratch-overlay.is-done {
            display: none;
        }
        #scratch-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: none;
            touch-action: none;
        }
    </style>

    <script>
        (function () {
           
           
            const overlay = document.getElementById('scratch-overlay');
            const canvas = document.getElementById('scratch-canvas');
            if (!overlay || !canvas) return;

           
            overlay.classList.add('is-done');

            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let revealedRatio = 0;
            let fadeTimer = null;
            let onCompleteCb = null;

           
            const REVEAL_THRESHOLD = 0.8;
            const BRUSH_RADIUS = 55;

            function resize() {
                const dpr = Math.max(1, window.devicePixelRatio || 1);
                const w = window.innerWidth;
                const h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                paint();
            }

            function paint() {
                const w = canvas.clientWidth;
                const h = canvas.clientHeight;
               
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.985)');
                grad.addColorStop(0.5, 'rgba(245, 240, 245, 0.985)');
                grad.addColorStop(1, 'rgba(235, 230, 240, 0.985)');
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
               
            }

            function scratch(x, y) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, BRUSH_RADIUS, 0, Math.PI * 2);
                ctx.fill();

               
                ctx.lineWidth = BRUSH_RADIUS * 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            function getPos(e) {
                if (e.touches && e.touches[0]) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function checkReveal() {
               
                if (revealedRatio > REVEAL_THRESHOLD) return;
                const w = canvas.width;
                const h = canvas.height;
                const step = 32;
                let cleared = 0;
                let total = 0;
                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const data = ctx.getImageData(x, y, 1, 1).data;
                        total++;
                       
                        if (data[3] < 50) cleared++;
                    }
                }
                revealedRatio = cleared / total;
                if (revealedRatio > REVEAL_THRESHOLD) {
                    fadeOut();
                }
            }

            let checkTimer = null;
            function scheduleCheck() {
                if (checkTimer) return;
                checkTimer = setTimeout(() => {
                    checkTimer = null;
                    checkReveal();
                }, 350);
            }

            function fadeOut() {
                if (fadeTimer) return;
                fadeTimer = setTimeout(() => {
                    overlay.classList.add('is-fading');
                    setTimeout(() => {
                        overlay.classList.add('is-done');
                       
                        isDrawing = false;
                        revealedRatio = 0;
                        fadeTimer = null;
                       
                        if (typeof onCompleteCb === 'function') {
                            const cb = onCompleteCb;
                            onCompleteCb = null;
                            cb();
                        }
                    }, 650);
                }, 400);
            }

           
            function resetOverlay() {
                overlay.classList.remove('is-done', 'is-fading', 'is-active');
                overlay.style.opacity = '1';
                resize();
            }

           
            canvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                const p = getPos(e);
                lastX = p.x;
                lastY = p.y;
                scratch(p.x, p.y);
                overlay.classList.add('is-active');
                e.preventDefault();
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                const p = getPos(e);
                scratch(p.x, p.y);
                lastX = p.x;
                lastY = p.y;
                scheduleCheck();
            });
            window.addEventListener('mouseup', () => {
                isDrawing = false;
            });
            canvas.addEventListener('mouseleave', () => {
                isDrawing = false;
            });

           
            canvas.addEventListener('touchstart', (e) => {
                isDrawing = true;
                const p = getPos(e);
                lastX = p.x;
                lastY = p.y;
                scratch(p.x, p.y);
                overlay.classList.add('is-active');
                e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                const p = getPos(e);
                scratch(p.x, p.y);
                lastX = p.x;
                lastY = p.y;
                scheduleCheck();
                e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchend', () => { isDrawing = false; });

           
            canvas.addEventListener('click', (e) => {
                const p = getPos(e);
                scratch(p.x, p.y);
                scheduleCheck();
            });

            window.addEventListener('resize', resize);
            resize();

           
           
           
           
            function autoDrawHeart() {
                const w = canvas.clientWidth;
                const h = canvas.clientHeight;
               
                const scale = Math.min(w, h) * 0.022;
                const cx = w / 2;
                const cy = h / 2 + scale * 1.2;

                const N = 140;
                const pts = [];
                for (let k = 0; k <= N; k++) {
                    const t = (k / N) * Math.PI * 2;
                    const sx = 16 * Math.pow(Math.sin(t), 3);
                    const sy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    pts.push({ x: cx + sx * scale, y: cy + sy * scale });
                }

               
                const brushR = Math.max(16, Math.min(22, Math.min(w, h) * 0.018));
               
                const drawSpeed = 6;
                let i = 0;

                function step() {
                    for (let k = 0; k < drawSpeed && i < pts.length; k++, i++) {
                        const p = pts[i];
                       
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, brushR, 0, Math.PI * 2);
                        ctx.fill();

                       
                        if (i > 0) {
                            const prev = pts[i - 1];
                            ctx.lineWidth = brushR * 2;
                            ctx.lineCap = 'round';
                            ctx.lineJoin = 'round';
                            ctx.beginPath();
                            ctx.moveTo(prev.x, prev.y);
                            ctx.lineTo(p.x, p.y);
                            ctx.stroke();
                        }
                    }
                    if (i < pts.length) {
                        requestAnimationFrame(step);
                    }
                   
                }
               
                setTimeout(() => requestAnimationFrame(step), 150);
            }

           
            window.openScratchOverlay = function (onComplete) {
                onCompleteCb = typeof onComplete === 'function' ? onComplete : null;
                resetOverlay();
               
                setTimeout(autoDrawHeart, 200);
            };
        })();
    </script>
