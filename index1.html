<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>𝓝𝓰𝓾𝔂𝓮𝓷 𝓓𝓾𝓬 𝓣𝓱𝓲𝓷𝓱</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese" rel="stylesheet"/>
<audio id="bgm" src="assets/music/10.mp3" loop preload="auto"></audio>
<style>
:root{--pink:#ff6fae;--rose:#ff3d84;--gold:#ffd9a8;--text:#fff1f6;--serif:"Playfair Display","Times New Roman",Georgia,serif;--script:"Dancing Script","Segoe Script","Brush Script MT",cursive;--sans:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,#4a1240,#2a0a24 70%);color:var(--text);font-family:var(--sans)}
.glow{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.35;pointer-events:none}
.g1{width:50vmax;height:50vmax;background:#ff2d8a;left:-15vmax;top:-10vmax}
.g2{width:40vmax;height:40vmax;background:#8a3dff;right:-12vmax;bottom:-10vmax}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite alternate;pointer-events:none}
@keyframes tw{from{opacity:0.1}to{opacity:0.9;box-shadow:0 0 8px #fff}}
#bg-wishes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s ease}
#bg-wishes.visible{opacity:1;visibility:visible}
.wish{position:absolute;left:0;top:0;white-space:nowrap;font-family:"Dancing Script","Pacifico","Brush Script MT","Segoe Script","Comic Sans MS",cursive,sans-serif;font-weight:700;color:#ff7eb6;text-shadow:0 1px 2px rgba(255,255,255,.9),0 0 10px rgba(255,158,200,.55),0 0 18px rgba(255,255,255,.4);user-select:none;letter-spacing:.02em;will-change:transform,opacity;transform:translate3d(0,0,0);animation:wishFloat linear infinite}
@keyframes wishFloat{0%{transform:translate3d(0,0,0) rotate(var(--rot,0deg));opacity:0}8%{opacity:.95}50%{opacity:1}92%{opacity:.55}100%{transform:translate3d(var(--dx,0px),-110vh,0) rotate(calc(var(--rot,0deg) + var(--drot,10deg)));opacity:0}}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity 1s,transform 1s;z-index:2}
#stage.hide{opacity:0;transform:scale(.92);pointer-events:none;visibility:hidden}
.line{display:flex;flex-wrap:wrap;justify-content:center;font-family:var(--serif);font-weight:900;line-height:1.15}
.l1{font-size:clamp(1.9rem,8.5vw,4rem);color:#fff}
.l2{font-size:clamp(2.6rem,12vw,5.8rem);color:var(--pink);text-shadow:0 0 30px var(--rose)}
.slot{display:inline-block;opacity:0;min-width:.05em}
.slot.sp{min-width:.35em}
.slot.ok{opacity:1;animation:pop .6s}
@keyframes pop{0%{transform:scale(1.6);filter:brightness(2.5)}100%{transform:none;filter:none}}
.fly{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font-family:var(--serif);font-weight:900;color:#ffb3d4;text-shadow:0 0 14px var(--rose);will-change:transform;transition:opacity 1s}
#hint{font-family:var(--script);font-size:1.6rem;color:var(--gold);animation:pulse 1.6s infinite;margin-top:1rem;text-align:center;padding:0 1rem}
@keyframes pulse{50%{opacity:.5;transform:scale(1.05)}}
#btn,#card-btn{padding:.85rem 2rem;border:0;border-radius:99px;font:600 1.05rem var(--sans);color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff6fae,#ff3d84);box-shadow:0 0 28px rgba(255,61,132,.55);transition:transform .2s;z-index:5}
#btn:hover,#card-btn:hover{transform:scale(1.07)}
#card{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:1rem;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.2s;overflow-y:auto}
#card.show{opacity:1;pointer-events:auto}
.box{position:relative;margin:auto;max-width:420px;width:100%;text-align:center;padding:1.5rem 1.1rem 1.1rem;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,182,213,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 25px 90px rgba(255,61,132,.35),inset 0 0 40px rgba(255,150,200,.08);transform:scale(.85) translateY(30px);transition:transform 1.2s cubic-bezier(.2,1.3,.3,1)}
#card.show .box{transform:none}
.badge{display:inline-block;padding:.25rem .8rem;border-radius:99px;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#4a1240;font-weight:600;background:linear-gradient(90deg,#ffd9a8,#ffb3d4);box-shadow:0 0 20px rgba(255,217,168,.5)}
.big{font-size:2.1rem;margin:.4rem 0 0;animation:beat 1.2s infinite}
@keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.t1{font-family:var(--script);font-size:1.25rem;color:var(--gold);margin:0}
.t2{font-family:var(--serif);font-size:clamp(1.7rem,8vw,2.4rem);margin:0 0 .2rem;background:linear-gradient(90deg,#ff9ec8,#fff,#ffd9a8,#ff6fae,#ff9ec8);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.t-solved{font-family:var(--script);font-size:1rem;color:#ff6fae;margin:.2rem 0 .6rem;font-weight:600;letter-spacing:.02em;opacity:0;transform:translateY(8px);animation:solvedIn .8s ease .3s forwards}
@keyframes solvedIn{to{opacity:1;transform:translateY(0)}}
.orn{display:flex;align-items:center;gap:.6rem;justify-content:center;color:var(--pink);margin:.4rem 0 1rem}
.orn:before,.orn:after{content:"";height:1px;width:22%;background:linear-gradient(90deg,transparent,var(--pink))}
.orn:after{transform:scaleX(-1)}
#msg{font-weight:300;font-size:.88rem;line-height:1.7;min-height:6.4em;margin:0 .3rem}
.wishes{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:.8rem 0}
.w{padding:.55rem .45rem;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,182,213,.25);opacity:0;transform:translateY(20px) scale(.9);transition:all .8s cubic-bezier(.2,1.4,.3,1)}
.w.on{opacity:1;transform:none}
.w i{font-style:normal;font-size:1.2rem;display:block}
.w b{display:block;font-family:var(--serif);font-size:.82rem;color:#ffc2dc;margin:.2rem 0}
.w span{font-size:.68rem;font-weight:300;opacity:.85;line-height:1.5;display:block}
.quote{font-family:var(--script);font-size:1.1rem;color:var(--gold);line-height:1.5;opacity:0;transition:opacity 1.2s}
.sign{font-family:var(--script);font-size:1.2rem;color:var(--pink);margin:.4rem 0 .3rem;opacity:0;transition:opacity 1.2s}
.acc{position:relative;display:flex;gap:.35rem;width:100%;height:230px;margin:.9rem 0 .4rem;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(255,61,132,.28)}
.acc-item{flex:1 1 0;min-width:0;position:relative;overflow:hidden;border-radius:12px;cursor:pointer;will-change:flex-grow;transition:flex-grow .55s cubic-bezier(.22,.61,.36,1),filter .55s ease}
.acc-item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,8,30,0) 35%,rgba(40,8,30,.85) 100%);opacity:.6;transition:opacity .55s ease;pointer-events:none;z-index:2}
.acc-item.center{flex-grow:6;z-index:2}
.acc-item.center::after{opacity:.25}
.acc-item:not(.center){filter:brightness(.7) saturate(.85)}
.acc-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease,filter .55s ease}
.acc-item.center img{transform:scale(1.05)}
.acc-item .emoji{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.5rem;z-index:3;transition:transform .55s cubic-bezier(.22,.61,.36,1),left .55s cubic-bezier(.22,.61,.36,1),top .55s cubic-bezier(.22,.61,.36,1),font-size .55s cubic-bezier(.22,.61,.36,1),opacity .4s ease;opacity:.55;filter:drop-shadow(0 0 8px rgba(255,217,168,.55))}
.acc-item:not(.center):hover .emoji{opacity:1;transform:translateY(-50%) scale(1.15)}
.acc-item.center .emoji{left:1.2rem;top:auto;bottom:1.2rem;transform:translate(0,0) scale(1.1);font-size:1.4rem;opacity:1}
.acc-item .vlabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(180deg);writing-mode:vertical-rl;font-family:"Playfair Display",serif;font-size:.95rem;letter-spacing:.18em;color:#fff;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);z-index:3;opacity:0;transition:opacity .35s ease;pointer-events:none;white-space:nowrap;display:none}
.acc-item .info{position:absolute;left:1.2rem;right:1.2rem;bottom:1rem;color:#fff;z-index:3;opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5)}
.acc-item.center .info{opacity:1;transform:translateY(0);transition-delay:.18s}
.acc-item .info .title{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;letter-spacing:.02em;color:#ffd9a8;display:block;text-shadow:0 0 16px rgba(255,217,168,.45)}
.acc-item .info .desc{font-family:"Dancing Script",cursive;font-size:1.05rem;font-weight:600;color:#fff;line-height:1.3;display:block;margin-top:.15rem}
@media (max-width:520px){.acc{height:180px}.acc-item .info .title{font-size:1.1rem}.acc-item .info .desc{font-size:.95rem}.acc-item .emoji{font-size:1.25rem;left:.7rem}.acc-item.center .emoji{font-size:1.1rem;bottom:.8rem;left:.8rem}}
@keyframes accIn{from{opacity:0}to{opacity:1}}
.acc-item{animation:accIn .8s ease-out both}
.acc-item:nth-child(1){animation-delay:0s}
.acc-item:nth-child(2){animation-delay:.08s}
.acc-item:nth-child(3){animation-delay:.16s}
.acc-item:nth-child(4){animation-delay:.24s}
.acc-item:nth-child(5){animation-delay:.32s}
.on2{opacity:1}
.btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity 1s}
.btns small{font-size:.7rem;opacity:.65;letter-spacing:.06em;font-weight:300}
.heart{position:fixed;bottom:-50px;z-index:1;pointer-events:none;animation:up linear forwards;filter:drop-shadow(0 0 8px rgba(255,61,132,.7))}
@keyframes up{to{transform:translate(var(--dx),-115vh) rotate(var(--rot));opacity:0}}
.burst{position:fixed;z-index:9;pointer-events:none;animation:bst .9s ease-out forwards}
@keyframes bst{to{transform:translate(var(--bx),var(--by)) scale(.3);opacity:0}}
*{cursor:none!important}
#cur{position:fixed;left:0;top:0;z-index:99;pointer-events:none;font-size:26px;color:#ff3d84;text-shadow:0 0 12px #ff3d84,0 0 28px #ff6fae;opacity:0;transition:opacity .3s}
#cur span{display:inline-block;animation:beat 1.2s infinite}
.trail{position:fixed;z-index:98;pointer-events:none;color:#ff6fae;transform:translate(-50%,-50%);animation:tr 1.1s ease-out forwards;text-shadow:0 0 8px rgba(255,61,132,.8)}
@keyframes tr{to{transform:translate(calc(-50% + var(--tx)),-90px) scale(.4);opacity:0}}
#scratch-overlay{position:fixed;inset:0;z-index:2147483600;background:transparent;overflow:hidden;transition:opacity .6s ease;opacity:1}
#scratch-overlay.is-fading{opacity:0;pointer-events:none}
#scratch-overlay.is-done{display:none}
#scratch-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="bg-wishes"></div>

<div id="stage">
  <div class="line l1" id="l1"></div>
  <div class="line l2" id="l2"></div>
  <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
  <button id="btn">Giải mã 💌</button>
</div>

<div id="card">
  <div class="box">
    <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
    <div class="big">💖</div>
    <p class="t1">Dành riêng cho</p>
    <h1 class="t2" id="name"></h1>
    <p class="t-solved">🔓 Giải mã thành công 💖</p>
    <div class="orn">❀ ❤ ❀</div>
    <div id="msg"></div>
    <div class="acc" id="acc" aria-label="Lời chúc 20·10"></div>
    <div class="quote" id="quote"></div>
    <div class="sign" id="sign"></div>
  </div>
</div>

<div id="scratch-overlay" aria-hidden="true">
  <canvas id="scratch-canvas"></canvas>
</div>

<script>
(function(){

const CFG = {
  l1: "CHÚC MỪNG 20/10",
  l2: "LAN Ý",
  name: "Lan Ý",
  intro: "Nhân ngày 20/10, chúc Lan Ý luôn xinh đẹp, rạng rỡ như một bông hoa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
  wishes: [
    ["🌸","Luôn xinh đẹp","Rạng rỡ từ nụ cười đến trái tim."],
    ["💖","Thật hạnh phúc","Mỗi ngày đều có một niềm vui nhỏ."],
    ["✨","Bình yên","Nhẹ nhàng giữa mọi bộn bề."],
    ["🌹","Được yêu thương","Nhiều hơn bạn có thể đếm hết."],
    ["🌿","Dồi dào sức khỏe","Thân thể khỏe mạnh, tinh thần an nhiên."],
  ],
  quote: "Cảm ơn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
  sign: "𝓝𝓰𝓾𝔂𝓮𝓷 𝓓𝓾𝓬 𝓣𝓱𝓲𝓷𝓱",
};

const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
const rnd = (a) => Array.isArray(a) || typeof a === "string" ? a[Math.floor(Math.random()*a.length)] : 0;
const R = (a,b) => Math.random()*(b-a)+a;
const $ = id => document.getElementById(id);

for(let i=0;i<60;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.cssText=`left:${R(0,100)}vw;top:${R(0,100)}vh;animation-delay:${R(0,3)}s`;
  document.body.appendChild(s);
}

$("name").textContent=CFG.name;
$("sign").textContent=CFG.sign;
$("quote").textContent=CFG.quote;
const acc = $("acc");
const N = Math.min(CFG.wishes.length, 5);
acc.innerHTML = CFG.wishes.slice(0, N).map((w, i) => `
  <div class="acc-item${i === 2 ? " center" : ""}" data-i="${i}">
    <img src="assets/em/${i + 1}.jpeg" alt="${w[1]}" loading="lazy" onerror="this.onerror=null;this.src=this.src.replace('.jpeg','.jpg');"/>
    <span class="emoji">${w[0]}</span>
    <div class="info"><span class="title">${w[1]}</span><span class="desc">${w[2]}</span></div>
  </div>
`).join("");

const accItems = acc.querySelectorAll(".acc-item");
let centerIdx = 2;
function setActive(el){
  accItems.forEach(x => x.classList.remove("center"));
  el.classList.add("center");
  centerIdx = +el.dataset.i;
}
accItems.forEach(it => {
  it.addEventListener("click", () => setActive(it));
});

// Hover-to-expand chỉ trên thiết bị có chuột (matchMedia hover: hover)
if (window.matchMedia && window.matchMedia("(hover: hover)").matches) {
  accItems.forEach(it => {
    it.addEventListener("mouseenter", () => setActive(it));
  });
}

// Swipe ngang trên touch (mobile/tablet)
let touchStartX = 0, touchStartY = 0, touchStartT = 0, touchMoved = false;
acc.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartT = Date.now();
  touchMoved = false;
}, { passive: true });

acc.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  // Chỉ tính là swipe ngang khi trục X rõ ràng hơn Y, tránh cuộn dọc
  if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    touchMoved = true;
  }
}, { passive: true });

acc.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  // Swipe khi: di chuyển đủ xa (>40px), theo trục ngang, thời gian hợp lý
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600) {
    const dir = dx < 0 ? 1 : -1; // vuốt trái = next, vuốt phải = prev
    const next = Math.max(0, Math.min(accItems.length - 1, centerIdx + dir));
    if (next !== centerIdx) setActive(accItems[next]);
  }
}, { passive: true });

// Phím mũi tên ← → (bonus)
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const dir = e.key === "ArrowRight" ? 1 : -1;
  const next = Math.max(0, Math.min(accItems.length - 1, centerIdx + dir));
  if (next !== centerIdx) setActive(accItems[next]);
});

(function initBgWishes(){
  const box=document.getElementById("bg-wishes");
  if(!box)return;
  const WISHES=[
    "Chúc Lan Ý 20/10 thật vui vẻ 🌸",
    "Mãi xinh đẹp rạng ngời như nắng mai ☀️",
    "Hạnh phúc ngập tràn mỗi ngày 💖",
    "Yêu thương thật nhiều, bình yên thật nhiều 🌷",
    "Bông hoa đẹp nhất trong vườn 🌺",
    "Cười tươi nhé, nụ cười của bạn đẹp lắm ✨",
    "Luôn tỏa sáng theo cách của riêng mình 💫",
    "Một ngày thật đặc biệt dành cho bạn 💝",
  ];
  const COLORS=["#ff7eb6","#c79bff","#7eb8ff","#ffb27e","#ff9eb5","#a8d8ff","#ffc2a8","#d8a8ff","#ff8fa3","#9ed4ff"];
  for(let i=0;i<8;i++){
    const el=document.createElement("div");
    el.className="wish";
    el.textContent=WISHES[i];
    const fs=18+Math.random()*6;
    const dur=18+Math.random()*12;
    const delay=-Math.random()*dur;
    const fromLeft=Math.random()<.5;
    const leftPx=fromLeft?(Math.random()*18):(82+Math.random()*16);
    const left=fromLeft?leftPx+"vw":leftPx+"vw";
    const startTop=100+Math.random()*15;
    const dx=(Math.random()-.5)*30;
    const rot=(Math.random()-.5)*20;
    const drot=(Math.random()-.5)*20;
    const color=COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.cssText="left:"+left+";top:"+startTop+"vh;font-size:"+fs+"px;color:"+color+";animation-duration:"+dur+"s;animation-delay:"+delay+"s;--dx:"+dx+"px;--rot:"+rot+"deg;--drot:"+drot+"deg;";
    box.appendChild(el);
  }
})();

const flyers=[];
let W=innerWidth,H=innerHeight,decoding=false,landed=0,total=0;
function build(el,text,cls){
  [...text].forEach(c=>{
    const s=document.createElement("span");
    s.className="slot"+(c===" "?" sp":"");
    s.textContent=c===" "?"\u00a0":c;
    el.appendChild(s);
    if(c!==" ") flyers.push({slot:s,c,cls,real:true});
  });
}
build($("l1"),CFG.l1,"l1");
build($("l2"),CFG.l2,"l2");
total=flyers.length;

function init(){
  flyers.forEach(f=>mk(f,parseFloat(getComputedStyle(f.slot).fontSize)));
  for(let i=0;i<34;i++){
    const f={real:false,c:"",cls:""};
    flyers.push(f);
    mk(f,R(18,56));
  }
  requestAnimationFrame(tick);
}
function mk(f,size){
  const e=document.createElement("div");
  e.className="fly";
  e.style.fontSize=size+"px";
  e.style.opacity=f.real?1:.55;
  e.style.color=rnd(["#ffb3d4","#ff6fae","#ffd9a8","#e0b3ff","#fff"]);
  e.textContent=rnd(POOL);
  document.body.appendChild(e);
  Object.assign(f,{el:e,x:R(0,W),y:R(0,H),vx:R(-2.6,2.6),vy:R(-2.6,2.6),rot:R(0,360),vr:R(-4,4),t:R(0,6),sc:1,state:"fly"});
}
function tick(){
  flyers.forEach(f=>{
    if(f.state==="done"||!f.el)return;
    if(f.state==="fly"){
      f.vx+=R(-.12,.12);f.vy+=R(-.12,.12);
      const m=Math.hypot(f.vx,f.vy),mx=3.2;
      if(m>mx){f.vx*=mx/m;f.vy*=mx/m}
      f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.t+=.04;f.sc=1+Math.sin(f.t)*.35;
      if(f.x<0||f.x>W)f.vx*=-1;
      if(f.y<0||f.y>H)f.vy*=-1;
      f.x=Math.max(-10,Math.min(W+10,f.x));
      f.y=Math.max(-10,Math.min(H+10,f.y));
    }else{
      const k=.075;
      f.x+=(f.tx-f.x)*k;f.y+=(f.ty-f.y)*k;f.rot+=(0-f.rot)*k;f.sc+=(1-f.sc)*k;
      if(Math.hypot(f.tx-f.x,f.ty-f.y)<1.2&&Math.abs(f.rot)<1) land(f);
    }
    f.el.style.transform=`translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
  });
  requestAnimationFrame(tick);
}
function land(f){
  f.state="done";f.el.remove();f.slot.classList.add("ok");sparkle(f.slot);
  if(++landed===total){
    
    heartStorm();
    setTimeout(()=>{
      $("stage").classList.add("hide");
      const bw=$("bg-wishes");
      if(bw)bw.classList.add("visible");
      if(typeof window.openScratchOverlay==="function"){
        window.openScratchOverlay(showCard);
      } else {
        showCard();
      }
    },800);
  }
}
setInterval(()=>flyers.forEach(f=>{if(f.el&&f.state!=="done"&&Math.random()<.4)f.el.textContent=rnd(POOL)}),150);

function decode(){
  if(decoding)return;decoding=true;
  $("btn").style.display="none";
  $("hint").textContent="Các chữ cái đang tìm về nhau... ✨";
  const bgm=document.getElementById("bgm");
  if(bgm){bgm.volume=.6;const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}
  let i=0;
  flyers.forEach(f=>{
    if(f.real){
      setTimeout(()=>{
        const r=f.slot.getBoundingClientRect();
        f.tx=r.left+r.width/2;f.ty=r.top+r.height/2;
        f.rot=(((f.rot%360)+540)%360)-180;
        f.state="go";f.el.textContent=f.c;
      },600+i++*160);
    } else {
      setTimeout(()=>{f.el.style.opacity=0},500+R(0,1500));
      setTimeout(()=>{f.state="done";f.el.remove()},2600);
    }
  });
}
$("btn").onclick=decode;
$("stage").addEventListener("click",e=>{if(e.target.id!=="btn")decode()});
addEventListener("resize",()=>{W=innerWidth;H=innerHeight});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);

function sparkle(el){
  const r=el.getBoundingClientRect();
  for(let i=0;i<4;i++) burst(r.left+r.width/2,r.top+r.height/2,"✦",10);
}
function burst(x,y,ch,size){
  const b=document.createElement("div");
  b.className="burst";
  b.textContent=ch;
  b.style.cssText+=`left:${x}px;top:${y}px;font-size:${size+R(0,10)}px;color:#ffc2dc;--bx:${R(-70,70)}px;--by:${R(-70,70)}px`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),900);
}
const HEARTS=["❤","💖","💗","💕","💘","🌸","🌹","💝"];
function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=rnd(HEARTS);
  const d=R(5,11);
  h.style.cssText+=`left:${R(0,100)}vw;font-size:${R(16,44)}px;animation-duration:${d}s;--dx:${R(-80,80)}px;--rot:${R(-40,40)}deg;opacity:${R(.6,1)}`;
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),d*1000);
}
function heartStorm(){for(let i=0;i<40;i++)setTimeout(heart,i*60)}

function showCard(){
  $("stage").classList.add("hide");
  $("card").classList.add("show");
  let i=0;
  setTimeout(function type(){
    $("msg").textContent=CFG.intro.slice(0,++i);
    if(i<CFG.intro.length) setTimeout(type,40);
    else{
      document.querySelectorAll(".w").forEach((w,k)=>setTimeout(()=>w.classList.add("on"),k*350));
      setTimeout(()=>$("quote").classList.add("on2"),1700);
      setTimeout(()=>$("sign").classList.add("on2"),2500);
      setTimeout(()=>$("btns").style.opacity=1,3000);
    }
  },1200);
}

addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();if(!decoding)decode();else heartStorm();}
});
const cur=document.createElement("div");
cur.id="cur";cur.innerHTML="<span>❤</span>";
document.body.appendChild(cur);
let lt=0;
addEventListener("pointermove",e=>{
  cur.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
  cur.style.opacity=1;
  const n=performance.now();
  if(n-lt<50)return;lt=n;
  const t=document.createElement("div");
  t.className="trail";
  t.textContent=rnd(["❤","💖","💗","💕"]);
  t.style.cssText+=`left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10,20)}px;--tx:${R(-30,30)}px`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1100);
});
document.addEventListener("mouseleave",()=>cur.style.opacity=0);
$("card").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON"){for(let i=0;i<6;i++)burst(e.clientX,e.clientY,rnd(HEARTS),18);}
});

})();

(function(){

const overlay=document.getElementById("scratch-overlay");
const canvas=document.getElementById("scratch-canvas");
if(!overlay||!canvas)return;
overlay.classList.add("is-done");

const ctx=canvas.getContext("2d",{willReadFrequently:true});
let isDrawing=false,lastX=0,lastY=0,revealedRatio=0,fadeTimer=null,onCompleteCb=null;
const REVEAL_THRESHOLD=.5;
const BRUSH_RADIUS=Math.max(16,Math.min(22,Math.min(window.innerWidth,window.innerHeight)*.018));

function resize(){
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const w=window.innerWidth,h=window.innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  paint();
}
function paint(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"rgba(255,255,255,.985)");
  grad.addColorStop(.5,"rgba(245,240,245,.985)");
  grad.addColorStop(1,"rgba(235,230,240,.985)");
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);
}
function scratch(x,y){
  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath();ctx.arc(x,y,BRUSH_RADIUS,0,Math.PI*2);ctx.fill();
  if(lastX&&lastY){
    ctx.lineWidth=BRUSH_RADIUS*2;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();
  }
  lastX=x;lastY=y;
}
function getPos(e){
  if(e.touches&&e.touches[0])return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function checkReveal(){
  if(revealedRatio>REVEAL_THRESHOLD)return;
  const w=canvas.width,h=canvas.height,step=32,total=(w/step+1)*(h/step+1);
  let cleared=0;
  for(let py=0;py<h;py+=step)for(let px=0;px<w;px+=step){
    const d=ctx.getImageData(px,py,1,1).data;
    if(d[3]<50)cleared++;
  }
  revealedRatio=cleared/total;
  if(revealedRatio>REVEAL_THRESHOLD)fadeOut();
}
let checkTimer=null;
function scheduleCheck(){
  if(checkTimer)return;
  checkTimer=setTimeout(()=>{checkTimer=null;checkReveal()},350);
}
function fadeOut(){
  if(fadeTimer)return;
  fadeTimer=setTimeout(()=>{
    overlay.classList.add("is-fading");
    setTimeout(()=>{
      overlay.classList.add("is-done");
      isDrawing=false;revealedRatio=0;fadeTimer=null;
      if(typeof onCompleteCb==="function"){
        const cb=onCompleteCb;onCompleteCb=null;cb();
      }
    },650);
  },400);
}
function resetOverlay(){
  overlay.classList.remove("is-done","is-fading");
  overlay.style.opacity="1";
  resize();
}

canvas.addEventListener("mousedown",e=>{
  isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;scratch(p.x,p.y);e.preventDefault();
});
canvas.addEventListener("mousemove",e=>{
  if(!isDrawing)return;
  const p=getPos(e);scratch(p.x,p.y);scheduleCheck();
});
window.addEventListener("mouseup",()=>isDrawing=false);
canvas.addEventListener("mouseleave",()=>isDrawing=false);
canvas.addEventListener("touchstart",e=>{
  isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;scratch(p.x,p.y);e.preventDefault();
},{passive:false});
canvas.addEventListener("touchmove",e=>{
  if(!isDrawing)return;
  const p=getPos(e);scratch(p.x,p.y);scheduleCheck();e.preventDefault();
},{passive:false});
canvas.addEventListener("touchend",()=>isDrawing=false);
canvas.addEventListener("click",e=>{
  const p=getPos(e);scratch(p.x,p.y);scheduleCheck();
});

window.addEventListener("resize",resize);
resize();

function autoDrawHeart(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const scale=Math.min(w,h)*.022;
  const cx=w/2,cy=h/2+scale*1.2;
  const N=140,pts=[];
  for(let k=0;k<=N;k++){
    const t=(k/N)*Math.PI*2;
    const sx=16*Math.pow(Math.sin(t),3);
    const sy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    pts.push({x:cx+sx*scale,y:cy+sy*scale});
  }
  const brushR=Math.max(16,Math.min(22,Math.min(w,h)*.018));
  const drawSpeed=6;
  let i=0;
  function step(){
    for(let k=0;k<drawSpeed&&i<pts.length;k++,i++){
      const p=pts[i];
      ctx.globalCompositeOperation="destination-out";
      ctx.beginPath();ctx.arc(p.x,p.y,brushR,0,Math.PI*2);ctx.fill();
      if(i>0){
        const prev=pts[i-1];
        ctx.lineWidth=brushR*2;ctx.lineCap="round";ctx.lineJoin="round";
        ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();
      }
    }
    if(i<pts.length)requestAnimationFrame(step);
  }
  setTimeout(()=>requestAnimationFrame(step),150);
}

window.openScratchOverlay=function(onComplete){
  onCompleteCb=typeof onComplete==="function"?onComplete:null;
  resetOverlay();
  setTimeout(autoDrawHeart,200);
};

})();
</script>
